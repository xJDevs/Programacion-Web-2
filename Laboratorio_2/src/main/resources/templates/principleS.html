<h1> S - [ Single Responsability SRP ] </h1>
<p> Principio de Responsabilidad Unica: Indica que una clase debe tener una, y solo una, razón para cambiar. Cada componente del código debe encargarse de una única tarea o responsabilidad dentro del sistema.</p>
